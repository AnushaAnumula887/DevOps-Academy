name: Simple CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show message
        run: echo "Hello! GitHub Actions pipeline is running."

      - name: Show files
        run: ls -la

      - name: Pipeline success
        run: echo "CI Pipeline completed successfully!"
